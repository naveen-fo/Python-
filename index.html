<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="description" content="Learn Python from basic to advanced in a 3D world." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="pwa-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="index.css" />
    <title>PyStep: Learn Python in 3D</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
          "htm": "https://esm.sh/htm@3.1.1",
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"><p style="font:16px system-ui,sans-serif;padding:24px">Loading PyStep...</p></div>
    <noscript>Please turn on JavaScript to use PyStep.</noscript>
    <script>
      // Shows the real problem instead of a blank page.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.textContent.indexOf('Loading PyStep') === 0) {
          var t = e.target || {};
          r.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;font:14px monospace">Error: ' +
            (e.message || 'could not load ' + (t.src || t.href || 'a file')) + '</pre>';
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = document.getElementById('root');
        if (r && r.textContent.indexOf('Loading PyStep') === 0) {
          r.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;font:14px monospace">Error: ' + (e.reason && e.reason.message || e.reason) + '</pre>';
        }
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
